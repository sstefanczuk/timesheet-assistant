name: Windows preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch-probe:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Probe exact launcher with a harmless console child
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/launch-probe | Out-Null
          Copy-Item src/TimesheetAssistant.UiTests/OwnedProcessJob.cs artifacts/launch-probe/
          '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup></Project>' | Set-Content artifacts/launch-probe/LaunchProbe.csproj
          @'
          using System.Diagnostics;
          using System.Reflection;
          using System.Security.Principal;
          using Microsoft.Win32.SafeHandles;
          using TimesheetAssistant.UiTests;
          if (Environment.GetEnvironmentVariable("LAUNCH_PROBE_CHILD") == "1") return;
          var type = typeof(OwnedProcessJob);
          using var identity = WindowsIdentity.GetCurrent();
          using var current = new SafeAccessTokenHandle(identity.Token);
          var read = type.GetMethod("ReadTokenInt", BindingFlags.NonPublic | BindingFlags.Static)!;
          Console.WriteLine($"Token elevation type: {read.Invoke(null, new object[] { current, 18 })} (2=linked, 1=restricted fallback)");
          var get = type.GetMethod("GetStandardLaunchToken", BindingFlags.NonPublic | BindingFlags.Static)!;
          using var token = (SafeAccessTokenHandle?)get.Invoke(null, null);
          Console.WriteLine($"Standard launch token prepared: {token is not null}");
          var executable = Environment.ProcessPath!;
          try {
              WindowsIdentity.RunImpersonated(token!, () => { using var file = File.OpenRead(executable); });
              Console.WriteLine("Exact workspace EXE read with standard token: PASS");
          } catch (Exception error) { Console.WriteLine($"Exact workspace EXE read: {error.GetType().Name}; HRESULT={error.HResult}"); }
          using var job = new OwnedProcessJob();
          var start = new ProcessStartInfo(executable) { UseShellExecute = false, WorkingDirectory = Path.GetDirectoryName(executable)! };
          start.Environment["LAUNCH_PROBE_CHILD"] = "1";
          try {
              using var child = job.StartApplication(start, TimeSpan.FromSeconds(15));
              if (!child.WaitForExit(15000)) throw new TimeoutException("Console child did not exit");
              Console.WriteLine($"Exact launcher: PASS; exit={child.ExitCode}");
          } catch (Exception error) { Console.WriteLine($"Exact launcher: {error}"); throw; }
          finally { job.Terminate(); }
          '@ | Set-Content artifacts/launch-probe/Program.cs
          dotnet run --project artifacts/launch-probe/LaunchProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
