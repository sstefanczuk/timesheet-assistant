name: Windows preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-context:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Compare only own parent and child desktop contexts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/context-probe | Out-Null
          Copy-Item src/TimesheetAssistant.UiTests/OwnedProcessJob.cs artifacts/context-probe/
          '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup></Project>' | Set-Content artifacts/context-probe/ContextProbe.csproj
          '{"sdk":{"version":"10.0.403","rollForward":"disable"}}' | Set-Content artifacts/context-probe/global.json
          @'
          using System.Diagnostics;
          using System.Reflection;
          using System.Runtime.InteropServices;
          using System.Security.Principal;
          using System.Text;
          using Microsoft.Win32.SafeHandles;
          using TimesheetAssistant.UiTests;
          static string Describe() => $"station={Native.Name(Native.GetProcessWindowStation())}; desktop={Native.Name(Native.GetThreadDesktop(Native.GetCurrentThreadId())))}; session={Process.GetCurrentProcess().SessionId}";
          if (Environment.GetEnvironmentVariable("CONTEXT_PROBE_CHILD") == "1") {
              File.WriteAllText(Environment.GetEnvironmentVariable("CONTEXT_PROBE_OUTPUT")!, Describe());
              return;
          }
          Console.WriteLine("Parent own context: " + Describe());
          var method = typeof(OwnedProcessJob).GetMethod("GetStandardLaunchToken", BindingFlags.NonPublic | BindingFlags.Static)!;
          using var token = (SafeAccessTokenHandle?)method.Invoke(null, new object[] { false });
          if (token is null) throw new InvalidOperationException("Diagnostic expects the hosted elevated path");
          var profile = Path.Combine(Path.GetTempPath(), "TimesheetAssistant.UiTests", Guid.NewGuid().ToString("N"), "webview2");
          Directory.CreateDirectory(profile);
          foreach (var target in new[] { (Name: "profile", Path: profile), (Name: "artifact", Path: Directory.GetCurrentDirectory()) }) {
              try {
                  WindowsIdentity.RunImpersonated(token, () => {
                      var marker = Path.Combine(target.Path, Guid.NewGuid().ToString("N") + ".probe");
                      try { File.WriteAllText(marker, "probe"); } finally { if (File.Exists(marker)) File.Delete(marker); }
                  });
                  Console.WriteLine($"Standard-token {target.Name} write/delete: PASS");
              } catch (Exception error) { Console.WriteLine($"Standard-token {target.Name} write/delete: {error.GetType().Name}; HRESULT={error.HResult}"); throw; }
          }
          using var job = new OwnedProcessJob();
          var executable = Environment.ProcessPath!;
          var report = Path.Combine(Directory.GetCurrentDirectory(), "child-context.txt");
          var start = new ProcessStartInfo(executable) { UseShellExecute = false, WorkingDirectory = Path.GetDirectoryName(executable)! };
          start.Environment["CONTEXT_PROBE_CHILD"] = "1";
          start.Environment["CONTEXT_PROBE_OUTPUT"] = report;
          try {
              using var child = job.StartApplication(start, TimeSpan.FromSeconds(15));
              if (!child.WaitForExit(15000)) throw new TimeoutException("Own diagnostic child did not exit");
              Console.WriteLine("Child own context: " + File.ReadAllText(report));
          } finally { job.Terminate(); }
          static class Native {
              [DllImport("user32.dll")] public static extern IntPtr GetProcessWindowStation();
              [DllImport("user32.dll")] public static extern IntPtr GetThreadDesktop(uint threadId);
              [DllImport("kernel32.dll")] public static extern uint GetCurrentThreadId();
              [DllImport("user32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              private static extern bool GetUserObjectInformation(IntPtr handle, int index, StringBuilder value, int length, out int needed);
              public static string Name(IntPtr handle) {
                  var text = new StringBuilder(512);
                  if (!GetUserObjectInformation(handle, 2, text, text.Capacity * 2, out _)) throw new System.ComponentModel.Win32Exception(Marshal.GetLastWin32Error());
                  return text.ToString();
              }
          }
          '@ | Set-Content artifacts/context-probe/Program.cs
          Set-Location artifacts/context-probe
          dotnet run --project ContextProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
