name: Windows preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-diagnostic:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Diagnose identical application source using existing public package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/cdp-probe,artifacts/cdp-app,artifacts/desktop-ui | Out-Null
          gh release download v0.1.0-preview.2 --repo sstefanczuk/timesheet-assistant --pattern TimesheetAssistant-0.1.0-preview.2-win-x64.zip --dir artifacts/release-download
          if ($LASTEXITCODE -ne 0) { throw 'Existing release download failed' }
          Copy-Item artifacts/release-download/TimesheetAssistant-0.1.0-preview.2-win-x64.zip artifacts/cdp-app.zip
          if ((Get-FileHash artifacts/cdp-app.zip -Algorithm SHA256).Hash -ne '119381a6579a9f4079158e82476c6e016cc42fd02756842c5a0c43954d36cdb2') { throw 'Existing release checksum mismatch' }
          Expand-Archive artifacts/cdp-app.zip artifacts/cdp-app
          Get-ChildItem src/TimesheetAssistant.UiTests -File | Copy-Item -Destination artifacts/cdp-probe
          '{"sdk":{"version":"10.0.403","rollForward":"disable"}}' | Set-Content artifacts/cdp-probe/global.json
          $env:TIMESHEET_ASSISTANT_TEST_APP = Join-Path $env:GITHUB_WORKSPACE 'artifacts/cdp-app/TimesheetAssistant.exe'
          $results = Join-Path $env:GITHUB_WORKSPACE 'artifacts/desktop-ui'
          Remove-Item Env:GH_TOKEN
          Set-Location artifacts/cdp-probe
          dotnet test TimesheetAssistant.UiTests.csproj -c Release --logger 'trx;LogFileName=runtime-diagnostic.trx' --results-directory $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain own-instance runtime diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-ui-diagnostics
          path: artifacts/desktop-ui/
          retention-days: 3


